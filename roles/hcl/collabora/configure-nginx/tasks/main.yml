---
# Configure nginx to handle Collabora WebSocket paths only.
# HTTP paths (/browser, /hosting, /cool) are handled by IHS.
# Ref: https://sdk.collaboraonline.com/docs/installation/Proxy_settings.html

- name: Backup nginx config
  ansible.builtin.command: cp {{ __nginx_conf_file }} {{ __nginx_conf_file }}.{{ __now }}
  ignore_errors: true

- name: Remove existing Collabora managed blocks
  ansible.builtin.replace:
    path: "{{ __nginx_conf_file }}"
    regexp: "{{ item }}"
    replace: ""
  loop:
    - "(?s)[ \\t]*# BEGIN COLLABORA WEBSOCKET PROXY(?:[^\\n]*)\\(MANAGED BY ANSIBLE\\).*?# END COLLABORA WEBSOCKET PROXY(?:[^\\n]*)\\(MANAGED BY ANSIBLE\\)[^\\n]*\\n"
    - "(?s)\\n*# BEGIN COLLABORA SERVER BLOCK.*?# END COLLABORA SERVER BLOCK[^\\n]*\\n"

# -------------------------------------------------------------------------
# OPTION A: Standard Configuration (For ALB or No-LB)
# -------------------------------------------------------------------------
- name: Add Collabora to existing 443/80 blocks (Standard/ALB)
  ansible.builtin.blockinfile:
    path: "{{ __nginx_conf_file }}"
    marker: "    # {mark} COLLABORA WEBSOCKET PROXY {{ item.label }} (MANAGED BY ANSIBLE)"
    insertafter: "{{ item.after }}"
    block: |
            location ~ ^/(cool|controller)/(adminws|ws|.+/ws)$ {
              proxy_pass {{ __ws_upstream_scheme }}://{{ __load_balancer_fqdn }}:{{ __ws_upstream_port }};
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "Upgrade";
              proxy_set_header Host $host;
              proxy_http_version 1.1;
              proxy_read_timeout 600s;
            }
  loop:
    - { label: "SSL",  after: "listen.*443.*ssl" }
    - { label: "HTTP", after: "listen.*80" }
  when: __lb_type != 'clb'  # Only run if NOT a Classic Load Balancer

# -------------------------------------------------------------------------
# OPTION B: CLB "Side-Door" Configuration (For CLB)
# -------------------------------------------------------------------------
- name: Add dedicated 8443 server block (For CLB)
  ansible.builtin.blockinfile:
    path: "{{ __nginx_conf_file }}"
    marker: "# {mark} COLLABORA SERVER BLOCK 8443 (MANAGED BY ANSIBLE)"
    insertafter: EOF
    block: |
      server {
          listen 8443;
          server_name {{ __load_balancer_fqdn }};

          location ~ ^/(cool|controller)/(adminws|ws|.+/ws)$ {
              proxy_pass {{ __ws_upstream_scheme }}://{{ __load_balancer_fqdn }}:{{ __ws_upstream_port }};
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "Upgrade";
              proxy_set_header Host $host;
              proxy_http_version 1.1;
              proxy_read_timeout 600s;
          }

          location / {
              proxy_pass https://{{ ic_internal }};
          }

      }
  when: __lb_type == 'clb'  # Only run if IT IS a Classic Load Balancer

- name: Finalize Nginx
  block:
    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      register: __nginx_test
      changed_when: false
    
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when: __nginx_test.rc == 0
  become: true