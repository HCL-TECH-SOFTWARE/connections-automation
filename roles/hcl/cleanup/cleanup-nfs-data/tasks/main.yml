- name:                    Cleanup NFS master data for ihs and websphere
  file:
    path:                  "{{ item }}"
    state:                 absent
  ignore_errors:           true
  with_items:
   - "{{ __cnx_message_store_nfs }}"
   - "{{ __cnx_shared_area_nfs }}"
  tags:
    - ihs_cleanup
    - was_cleanup
  when:
   - __force_destroy_ihs | bool or __force_destroy_websphere | bool
   - inventory_hostname == groups['nfs_servers'][0]
   - not __preserve_nfs_data | bool

- name:                    Cleanup NFS master data for component pack
  file:
    path:                  "{{ item }}"
    state:                 absent
  ignore_errors:           true
  with_items:
   - "{{ __nfs_master_source }}"
  tags:                    k8s_cleanup
  when:
   - inventory_hostname == groups['nfs_servers'][0]
   - __force_destroy_kubernetes | bool
   - not __preserve_nfs_data | bool

- name:                    Cleanup NFS master data for docs
  file:
    path:                  "{{ item }}"
    state:                 absent
  ignore_errors:           true
  with_items:
   - "{{ __viewer_data_remote_path }}"
   - "{{ __docs_data_remote_path }}"
  tags:                    docs_cleanup
  when:
   - inventory_hostname == groups['nfs_servers'][0]
   - __force_destroy_docs | bool
   - not __preserve_nfs_data | bool