# Common variables
__sudo_user:                                      "{{ kubectl_user | default( ansible_env['SUDO_USER'] ) | default('lcuser') }}"
__cnx_cec_temp_dir_location:                      "/home/{{ __sudo_user }}/generated_charts/cnx-cec"

# NFS variables
__nfsMasterAddress:                               "{{ nfsMasterAddress | default( hostvars[groups['nfs_servers'][0]]['ansible_default_ipv4']['address'] ) }}"
__nfs_export_netmask:                             "{{ nfs_export_netmask | default( hostvars[groups['nfs_servers'][0]]['ansible_default_ipv4']['netmask'] ) }}"
__nfs_client_network_address:                     "{{ nfs_client_Address | default( hostvars[inventory_hostname]['ansible_default_ipv4']['network'] ) }}"
__persistentVolumePath:                           "{{ persistentVolumePath | default('pv-connections') }}"

# Persistent Volumes variables
__cnx_cec_web_engine_customization_volume_name:   "{{ cnx_cec_web_engine_customization_volume_name | default('rwovol-web-engine-customization') }}"
__cnx_cec_web_engine_log_volume_name:             "{{ cnx_cec_web_engine_log_volume_name | default('rwovol-web-engine-log') }}"
__cnx_cec_web_engine_volume_storage_class:        "{{ cnx_cec_web_engine_volume_storage_class | default('manual') }}"
__cnx_cec_web_engine_volume_storage_capacity:     "{{ cnx_cec_web_engine_volume_storage_capacity | default('100Gi') }}"
__cnx_cec_web_engine_volume_access_mode:          "{{ cnx_cec_web_engine_volume_access_mode | default('ReadWriteOnce') }}"
__cnx_cec_web_engine_volume_reclaim_policy:       "{{ cnx_cec_web_engine_volume_reclaim_policy | default('Retain') }}"
