---
- name:                       Prepare OS for Nginx
  include_tasks:              setup_os.yml

- name:                       Install Nginx
  include_tasks:              install_nginx.yml

- name:                       Configure virtual host
  include_tasks:              configure_virtual_host.yml
  when:                       __setup_file_server |bool

- name:                       Configure customizer
  include_tasks:              configure_customizer.yml
  when:                       __setup_customizer |bool

- name:                       Configure NGINX without Component Pack
  include_tasks:              configure_no_cp_nginx_conf.yml
  when:                       __setup_k8s_no_cp |bool

- name:                       Add the NGINX certificate to trust store (if DMGR is up)
  block:
    - include_role:
        name:                 roles/third_party/ibm/wasnd/was-dmgr-config-add-cert-truststore
      vars:
        __trust_cert_host:    "{{ inventory_hostname }}"
  delegate_to:                "{{ dmgr_hostname }}"
  rescue:
    - name:                   Display warning if certificate is not added
      debug:
        msg:                  "WARNING: Unable to add the NGINX certificate to the DMGR trust store. This might be because the DMGR is not running. Please add the certificate manually."
  when:                       pool_server is not defined