---
 - name:                       Get root filesystem available space (MB)
   ansible.builtin.shell:      df -P -B1M / | awk 'NR==2{print $4}'
   register:                   root_avail_mb_cmd
   changed_when:               false

 - name:                       Set root_avail_mb
   ansible.builtin.set_fact:
     root_avail_mb:           "{{ root_avail_mb_cmd.stdout | int }}"

 - name:                       Set desired swap size from __swapfile_size
   ansible.builtin.set_fact:
     desired_swap_size_mb:    "{{ __swapfile_size | int }}"

 - name:                       Cap swap size at 10% of disk when using default
   ansible.builtin.set_fact:
     desired_swap_size_mb:    "{{ (root_avail_mb | int // 10) if (desired_swap_size_mb | int > root_avail_mb | int // 10) else (desired_swap_size_mb | int) }}"
   when:                       swapfile_size is not defined

 - name:                       Enforce minimum swap size when using default
   ansible.builtin.set_fact:
     desired_swap_size_mb:    "{{ [desired_swap_size_mb | int, 2048] | max }}"
   when:                       swapfile_size is not defined

 - name:                       Fail if desired swap size exceeds available disk space
   ansible.builtin.fail:
     msg: >-
       CRITICAL SYSTEM RESOURCE SHORTAGE: Required swap size ({{ desired_swap_size_mb }}MB)
       exceeds remaining available disk space ({{ root_avail_mb }}MB)!
       Please free up disk space or adjust configuration before provisioning.
   when:                       desired_swap_size_mb | int > root_avail_mb | int

 - name:                       Sync final calculated size back to HCL internal variable
   ansible.builtin.set_fact:
     __swapfile_size:         "{{ desired_swap_size_mb | int }}"

 - name:                       Check if swap file exists
   ansible.builtin.stat:
     path:                    "{{ __swapfile_location }}"
   register:                  swap_file_exists
   changed_when:              false

 - name:                       If swap file exists and wrong size, disable and remove
   block:
     - name:                    Disable existing swap file
       ansible.builtin.command: swapoff "{{ __swapfile_location }}"
       ignore_errors:           true

     - name:                    Remove existing swap file
       ansible.builtin.file:
         path:                  "{{ __swapfile_location }}"
         state:                 absent
   when:                       swap_file_exists.stat.exists and (swap_file_exists.stat.size != (desired_swap_size_mb | int * 1024 * 1024))

 - name:                       Create swap file
   ansible.builtin.command:    dd if=/dev/zero of="{{ __swapfile_location }}" bs=1M count={{ desired_swap_size_mb }}
   args:
     creates:                  "{{ __swapfile_location }}"
   register:                   swap_file_created

 - name:                       Set swapfile permissions
   ansible.builtin.file:
     path:                    "{{ __swapfile_location }}"
     owner:                    root
     group:                    root
     mode:                     '0600'

 - name:                       Check swap signature
   ansible.builtin.command:    blkid -o value -s TYPE "{{ __swapfile_location }}"
   register:                   blkid_type
   failed_when:                false
   changed_when:               false

 - name:                       Make swap if not already formatted
   ansible.builtin.command:    mkswap "{{ __swapfile_location }}"
   when:                       blkid_type.stdout != 'swap'

 - name:                       Ensure swap is in fstab
   ansible.posix.mount:
     path:                    none
     src:                     "{{ __swapfile_location }}"
     fstype:                  swap
     opts:                    sw
     state:                   present

 - name:                       Activate swap space
   ansible.builtin.command:    swapon -a
   changed_when:               false

 - name:                       Configure swappiness
   ansible.posix.sysctl:
     name:                    vm.swappiness
     value:                   "1"
     state:                   present

 - name:                       Create swap success marker
   ansible.builtin.file:
     path:                    "{{ __swapfile_success }}"
     state:                   touch